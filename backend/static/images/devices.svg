<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Illustration of a phone, wireless earbuds and a smartwatch">
  <defs>
    <linearGradient id="bgv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCE6D6"/>
      <stop offset="1" stop-color="#E9E5DA"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bgv)"/>
  <circle cx="330" cy="240" r="170" fill="#B9CFAB" opacity="0.35"/>
  <!-- phone -->
  <rect x="250" y="96" width="150" height="288" rx="22" fill="#254D3A"/>
  <rect x="262" y="110" width="126" height="260" rx="12" fill="#FCFBF7"/>
  <rect x="300" y="118" width="50" height="7" rx="3.5" fill="#254D3A" opacity="0.4"/>
  <rect x="278" y="150" width="94" height="70" rx="8" fill="#B9CFAB"/>
  <rect x="278" y="234" width="94" height="12" rx="6" fill="#DCE6D6"/>
  <rect x="278" y="256" width="70" height="12" rx="6" fill="#DCE6D6"/>
  <rect x="278" y="278" width="94" height="12" rx="6" fill="#DCE6D6"/>
  <!-- earbuds -->
  <g transform="translate(120 300)">
    <rect x="0" y="0" width="120" height="86" rx="26" fill="#FCFBF7" stroke="#254D3A" stroke-width="3"/>
    <path d="M18 22 h84" stroke="#DCE6D6" stroke-width="6" stroke-linecap="round"/>
    <path d="M42 0 a10 10 0 0 1 36 0" fill="none" stroke="#254D3A" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g fill="#254D3A">
    <path d="M132 260 a16 16 0 0 1 16 16 v14 a16 16 0 0 1 -32 0 v-14 a16 16 0 0 1 16 -16 z"/>
    <path d="M196 260 a16 16 0 0 1 16 16 v14 a16 16 0 0 1 -32 0 v-14 a16 16 0 0 1 16 -16 z"/>
  </g>
  <!-- watch -->
  <g transform="translate(430 200)">
    <rect x="24" y="0" width="24" height="60" rx="10" fill="#9DBE8A"/>
    <rect x="24" y="132" width="24" height="60" rx="10" fill="#9DBE8A"/>
    <rect x="0" y="46" width="72" height="100" rx="22" fill="#254D3A"/>
    <rect x="10" y="58" width="52" height="76" rx="14" fill="#FCFBF7"/>
    <circle cx="36" cy="96" r="20" fill="none" stroke="#254D3A" stroke-width="5"/>
    <path d="M36 96 L36 82" stroke="#254D3A" stroke-width="4" stroke-linecap="round"/>
    <path d="M36 96 L48 102" stroke="#254D3A" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
